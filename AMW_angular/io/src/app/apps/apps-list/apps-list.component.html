@if (apps() && apps().length > 0) {
  <table class="table table-sm mb-0">
    <tbody>
      @for (app of apps(); track app.id) {
        <tr>
          <td>
            <a (click)="navigateToResource(app.id); $event.preventDefault()" href="#">{{ app.name }}</a>
          </td>
          <td class="text-end pe-0">
            <a (click)="navigateToResource(app.id); $event.preventDefault()" href="#">{{ app.release.name }}</a>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
