<app-tile-component
  [title]="'Functions'"
  [actionName]="'New Function'"
  [canAction]="!isLoading() && permissions().canAdd"
  (tileAction)="add()"
  [noContent]="!isLoading() && !functionsData()"
  [notAllowed]="!isLoading() && (functionsData()?.length ?? 0) <= 0"
>
  @if (isLoading()) {
    <app-placeholder-rows [rows]="3"></app-placeholder-rows>
  } @else {
    @for (list of functionsData(); track list.title) {
      <app-tile-list
        [title]="list.title"
        [data]="list.entries"
        [canEdit]="list.canEdit ?? false"
        [canDelete]="list.canDelete ?? false"
        [canOverwrite]="list.canOverwrite ?? false"
        (edit)="doListAction($event)"
        (delete)="doListAction($event)"
        (overwrite)="doListAction($event)"
      ></app-tile-list>
    }
  }
</app-tile-component>
